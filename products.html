<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbiome | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Symbiome Logo" class="logo-img">
                </a>
            </div>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </nav>

            <button class="mobile-menu-btn" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>
    <!-- Page Hero Section -->
    <section class="page-hero">
        <div class="page-hero-bg">
            <img src="images/prod-hero.png" alt="Products Hero Background">
        </div>
        <div class="container relative z-10">
            <div class="page-hero-content">
                <h1 class="page-title">Our <span class="text-green">Products</span></h1>
                <div class="title-divider"></div>
                <p class="page-subtitle">Science-driven formulations designed to support<br>better health with quality, safety and trust.</p>
            </div>
        </div>
    </section>

    <script>
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const navLinks = document.querySelector('.nav-links');

        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active-menu');
            mobileMenuBtn.classList.toggle('open');
        });
    </script>
</body>

</html>
